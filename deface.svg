          margin-top: 20px;
          background: rgba(255, 0, 0, 0.1);
          box-shadow: 0 0 15px #f00;
          width: 90%;
          max-width: 500px;
          animation: blink 0.2s infinite;
        }

        .status { 
          color: #fff; 
          font-size: 1rem;
          text-shadow: 0 0 5px #f00; 
          margin: 5px 0;
        }

        @keyframes glitch-anim {
          0% { clip: rect(31px, 999px, 94px, 0); }
          100% { clip: rect(12px, 999px, 31px, 0); }
        }
        
        @keyframes glitch-anim2 {
          0% { clip: rect(10px, 999px, 50px, 0); }
          100% { clip: rect(40px, 999px, 80px, 0); }
        }

        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.9; }
        }
      </style>

      <div class="glitch-wrapper">
