<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="#000" />
  
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height: 100%; width: 100%;">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

        .bg-master {
          background: #000;
          height: 100vh;
          width: 100vw;
          margin: 0;
          padding: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          font-family: 'Share Tech Mono', monospace;
          color: #ff0000;
          overflow: hidden;
          position: relative;
        }

        /* Effect Scanline */
        .lines {
          position: absolute;
          top: 0; left: 0; width: 100%; height: 100%;
          background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                      linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
          background-size: 100% 3px, 3px 100%;
          pointer-events: none;
        }

        .content {
          text-align: center;
          z-index: 10;
          width: 90%;
        }

        h1 {
          font-size: 10vw;
          margin: 0;
          color: #fff;
          text-transform: uppercase;
          letter-spacing: 2vw;
          text-shadow: 3px 3px #ff0000, -3px -3px #0000ff;
          animation: glitch-v3 0.1s infinite;
        }

        .box {
          margin-top: 5vh;
          padding: 2vh;
          border: 2px solid #ff0000;
          background: rgba(255, 0, 0, 0.1);
          box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .msg {
          font-size: 3.5vw;
          color: #fff;
          margin: 10px 0;
        }

        @media (min-width: 1024px) {
          h1 { font-size: 80px; letter-spacing: 15px; }
          .msg { font-size: 18px; }
        }

        @keyframes glitch-v3 {
          0% { transform: translate(0); }
          20% { transform: translate(-2px, 2px); }
          40% { transform: translate(-2px, -2px); }
          60% { transform: translate(2px, 2px); }
          80% { transform: translate(2px, -2px); }
          100% { transform: translate(0); }
        }
      </style>

      <div class="bg-master">
        <div class="lines"></div>
        <div class="content">
          <h1>./KSOTARIA</h1>
          <div class="box">
            <div class="msg">[ STATUS: HACKED BY KSOTARIA 1337 ]</div>
            <div class="msg">[ GREETZ: ALL INDO HACKER ]</div>
          </div>
          <p style="color: #333; margin-top: 5vh;">#FuckYou_Mafia</p>
        </div>
      </div>
    </div>
  </foreignObject>

  <script type="text/javascript">
    <![CDATA[
      // Payload Pop-up Berhasil
      alert("hacked by ksotaria1337");
      
      try {
        document.title = "404 SYSTEM NOT FOUND";
        console.log("Ksotaria was here.");
      } catch(e) {}
    ]]>
  </script>
</svg>
