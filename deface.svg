      <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&amp;display=swap');

        * { box-sizing: border-box; }
        
        body {
          background: #000;
          color: #f00;
          font-family: 'Courier Prime', monospace;
          margin: 0;
          padding: 20px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          overflow: hidden;
