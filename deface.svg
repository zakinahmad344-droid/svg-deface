<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#050505">
    <animate attributeName="fill" values="#050505;#0f0000;#050505" dur="10s" repeatCount="indefinite" />
  </rect>

  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

        body {
          margin: 0; padding: 0;
          background: transparent;
          font-family: 'Share Tech Mono', monospace;
          color: #ff0000;
          height: 100vh;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          overflow: hidden;
        }

        /* Overlay Scanline yang lebih realistis */
        .scanlines {
          position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
          background-size: 100% 4px;
          pointer-events: none;
          z-index: 10;
          opacity: 0.6;
        }

        .container { text-align: center; z-index: 5; }

        /* H1: Glitch & Glow */
        h1 {
          font-size: 5rem;
          margin: 0;
          text-transform: uppercase;
          letter-spacing: 15px;
          color: #fff;
          filter: url(#neonGlow);
          text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000;
          animation: intenseGlitch 0.2s infinite, flicker 5s infinite;
        }

        /* Subtitle: Typing Effect */
        .subtitle {
          color: #fff;
          font-size: 1.4rem;
          letter-spacing: 5px;
          margin-top: 15px;
          opacity: 0.9;
          white-space: nowrap;
          overflow: hidden;
          border-right: 3px solid #ff0000;
          width: 0;
          animation: typing 4s steps(30, end) forwards, blink-caret 0.75s step-end infinite;
          filter: url(#neonGlow);
        }

        /* Msg-Box: Blinking Neon Border */
        .msg-box {
          margin-top: 40px;
          padding: 15px 30px;
          border: 2px solid #ff0000;
          background: rgba(255, 0, 0, 0.05);
          box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
          font-size: 1.1rem;
          line-height: 1.6;
          animation: neonBorderFlicker 2s infinite;
        }

        .highlight { color: #fff; text-shadow: 0 0 5px #ff0000; }

        .footer { margin-top: 70px; color: #444; font-size: 0.9rem; letter-spacing: 2px;}

        /* --- ANIMASI KEYFRAMES --- */

        @keyframes intenseGlitch {
          0% { transform: translate(2px, 1px) rotate(0deg); text-shadow: 2px 0 #0f0, -2px 0 #00f; }
          20% { transform: translate(-1px, -1px) rotate(1deg); text-shadow: -2px 0 #f00, 2px 0 #0f0; }
          40% { transform: translate(1px, -2px) rotate(-1deg); text-shadow: 1px 0 #00f, -1px 0 #f00; }
          60% { transform: translate(-2px, 1px) rotate(0deg); text-shadow: -1px 0 #0f0, 1px 0 #00f; }
          80% { transform: translate(1px, 2px) rotate(1deg); text-shadow: 2px 0 #f00, -2px 0 #f00; }
          100% { transform: translate(1px, -1px) rotate(0deg); text-shadow: -1px 0 #00f, 1px 0 #0f0; }
        }

        @keyframes flicker {
          0%, 19.999%, 22%, 62.999%, 64%, 100% { opacity: 1; }
          20%, 21.999%, 63%, 63.999% { opacity: 0.3; text-shadow: none; }
        }

        @keyframes typing { from { width: 0; } to { width: 100%; } }

        @keyframes blink-caret { from, to { border-color: transparent; } 50% { border-color: #ff0000; } }

        @keyframes neonBorderFlicker {
          0%, 100% { border-color: #ff0000; box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); }
          50% { border-color: #440000; box-shadow: 0 0 10px rgba(255, 0, 0, 0.2); }
          90% { border-color: #ff3333; box-shadow: 0 0 30px rgba(255, 0, 0, 0.8); }
        }
      </style>
      <div class="scanlines"></div>
      <div class="container">
        <h1>./KSOTARIA</h1>
        <div class="subtitle">SYSTEM HAS BEEN COMPROMISED</div>
        <div class="msg-box">
          [ <span class="highlight">STATUS: HACKED BY KSOTARIA 1337</span> ]<br/>
          [ <span class="highlight">GREETZ: MY SELF &amp; ALL INDO HACKER</span> ]
        </div>
        <div class="footer">#FuckYou_Mafia</div>
      </div>
    </div>
  </foreignObject>

  <script type="text/javascript">
    <![CDATA[
      // 1. Perintah Tuan: XSS Pop-up
      alert("hacked by ksotaria1337");

      // 2. Logic Tambahan: Verifikasi & Judul
      console.log("%cTouched by Ksotaria", "color: red; font-size: 20px; font-weight: bold;");
      try {
        document.title = "[ X ] 404 - SYSTEM NOT FOUND [ X ]";
      } catch(e) {}
    ]]>
  </script>
</svg>
